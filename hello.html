<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Button</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-family: "Malgun Gothic", sans-serif;
      background: #f5f5f5;
    }
    button {
      padding: 14px 32px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    #message {
      font-size: 28px;
      font-weight: bold;
      min-height: 36px;
    }
  </style>
</head>
<body>
  <button id="helloBtn">버튼</button>
  <p id="message"></p>

  <script>
    document.getElementById("helloBtn").addEventListener("click", function () {
      document.getElementById("message").textContent = "hello";
    });
  </script>
</body>
</html>
