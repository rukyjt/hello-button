<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Button</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-family: "Malgun Gothic", sans-serif;
      background: #f5f5f5;
    }
    .buttons {
      display: flex;
      gap: 16px;
    }
    button {
      padding: 14px 32px;
      font-size: 18px;
      border: 2px solid #16a34a;
      border-radius: 8px;
      background: #16a34a;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #15803d; border-color: #15803d; }
    #helloBtn { }
    #greetBtn {
      border-color: #c4b5fd;
      background: #c4b5fd;
      color: #3b0764;
    }
    #greetBtn:hover { background: #a78bfa; border-color: #a78bfa; }
    #message {
      font-size: 28px;
      font-weight: bold;
      min-height: 36px;
    }
  </style>
</head>
<body>
  <div class="buttons">
    <button id="helloBtn">버튼</button>
    <button id="greetBtn">반가워요</button>
  </div>
  <p id="message"></p>

  <script>
    document.getElementById("helloBtn").addEventListener("click", function () {
      document.getElementById("message").textContent = "hello";
    });
    document.getElementById("greetBtn").addEventListener("click", function () {
      document.getElementById("message").textContent = "반가워요";
    });
  </script>
</body>
</html>
